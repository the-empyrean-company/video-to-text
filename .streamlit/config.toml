[server]
# Max upload size in MB. Default is 200.
# Streamlit buffers the entire upload in server RAM, so keep this within the
# host's memory budget (Streamlit Community Cloud is ~1 GB). Larger files should
# be run through the CLI script (transcribe_cli.py) instead.
maxUploadSize = 1024

[theme]
# Qargo brand palette (see Qargo styling guide)
primaryColor = "#00E85B"       # Qargo Green
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
textColor = "#1C2C31"          # Qargo Navy
font = "sans serif"
